<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imagens/logo.ico" type="image/png">
    <title>CestaCheia</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style/AlterarSenha.css">
</head>
<body>
    <div class="main-container">
        <header>
            <div class="header-content">
                <div class="logo">
                    <img src="imagens/logo.png" alt="CestaCheia Logo" class="logo">
                </div>
                <div class="text-container">
                    <h1>Alterar Senha.</h1>
                </div>
            </div>
        </header>
        <main>
            <div class="image-container">
                <img src="imagens/imagem04.png" alt="Imagem 04" class="imagem04">
            </div>
            <div class="alterar-senha">
                <form id="form" class="form">
                    <p class="text">Digite sua nova senha:</p>
                    <div class="frame-1">
                        <input type="password" id="password" name="password" placeholder="Nova Senha" required><br>
                        <i class="fa fa-eye" id="togglePassword1" style="cursor: pointer;"></i>
                        <span class="error" id="passwordError"></span><br>
                    </div>
                    <div class="frame-2">
                        <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Confirmar Senha" required><br>
                        <i class="fa fa-eye" id="togglePassword2" style="cursor: pointer;"></i>
                        <span class="error" id="confirmpasswordError"></span><br>
                    </div>
                    <div class="alterar">
                        <button type="button" class="rectangle" onclick="window.location.href='SenhaAlterada.html'">Alterar</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("form");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmpassword");
    const passwordError = document.getElementById("passwordError");
    const confirmPasswordError = document.getElementById("confirmpasswordError");
    const togglePasswordIcon1 = document.getElementById('togglePassword1');
    const togglePasswordIcon2 = document.getElementById('togglePassword2');

    form.addEventListener("submit", (e) => {
        e.preventDefault();
        validatePassword();
    });

    togglePasswordIcon1.addEventListener('click', function() {
        togglePasswordVisibility(passwordInput, this);
    });
    togglePasswordIcon2.addEventListener('click', function() {
        togglePasswordVisibility(confirmPasswordInput, this);
    });

    function validatePassword() {
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        let valid = true;

        if (password.length < 6) {
            passwordError.textContent = "A senha deve ter pelo menos 6 caracteres.";
            valid = false;
        } else {
            passwordError.textContent = "";
        }

        if (password !== confirmPassword) {
            confirmPasswordError.textContent = "As senhas não coincidem.";
            valid = false;
        } else {
            confirmPasswordError.textContent = "";
        }

        if (valid) {
            window.location.href = 'SenhaAlterada.html';
        }
    }

    function togglePasswordVisibility(inputField, iconElement) {
        const type = inputField.getAttribute('type') === 'password' ? 'text' : 'password';
        inputField.setAttribute('type', type);
        iconElement.classList.toggle('fa-eye-slash');

        // Adicionar/remover classe para estilo de senha visível
        inputField.classList.toggle('password-visible');
    }
});
    </script>

</body>
</html>
