<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imagens/logo.ico" type="image/png">
    <title>CestaCheia</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap">
    <link rel="stylesheet" href="style/EsqueceuSenha.css">
</head>
<body>
    <div class="main-container">
        <header>
            <div class="header-content">
                <div class="logo-container">
                    <img src="imagens/logo.png" alt="CestaCheia Logo" class="logo">
                </div>
                <div class="text-container">
                    <h1>Esqueceu a senha?</h1>
                </div>
            </div>
        </header>
        <main>
            <div class="image-container">
                <img src="imagens/imagem04.png" alt="Imagem 04" class="imagem04">
            </div>
            <div class="esqueceu-senha">
                <form id="form" class="form">
                    <p class="email-input">Digite o email associado à conta:</p>
                    <div class="frame">
                        <input type="email" id="email" name="email" placeholder="Email" required>
                        <span class="error" id="emailError"></span>
                    </div>
                    <div class="flex-row">
                        <a href="TentarOutraManeira.html">Tentar de outra maneira</a>
                        <button type="submit" class="rectangle">Enviar</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script>
        document.getElementById('form').addEventListener('submit', function(event) {
    event.preventDefault(); // Prevenir o envio imediato do formulário

    const email = document.getElementById('email').value;
    const emailError = document.getElementById('emailError');
    const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    // Limpar mensagem de erro
    emailError.textContent = '';

    if (!emailPattern.test(email)) {
        emailError.textContent = 'Email inválido';
        return false;
    }

    // Adiciona a classe de fade-out ao corpo da página
    document.body.classList.add('fade-out');

    // Espera um curto período antes de redirecionar para a nova página
    setTimeout(() => {
        window.location.href = 'EmailEnviado.html';
    }, 500); // Tempo de espera para a transição (em milissegundos)

    return true;
});

    </script>
</body>
</html>
